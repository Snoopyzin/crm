<!doctype html>
<meta charset="utf-8">
<title>Caminhão do cliente — cena 3D</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';

// ---- parâmetros (URL): ?cor=%23D1262C&w=1200&h=675
const q = new URLSearchParams(location.search);
const COR = q.get('cor') || '#D1262C';
const W = +q.get('w') || 1200, H = +q.get('h') || 675;
const LOOP = 4;                         // segundos do ciclo (loop perfeito)
const ROAD_DIST = 96;                   // metros percorridos por ciclo (4 períodos de 24 m)
const WHEEL_REVS = 29;                  // voltas de roda por ciclo (96 m / 3,27 m)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf0b27c, 0.0062);

// ---------------------------------------------------------------- utilidades
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const mod = (a, b) => ((a % b) + b) % b;
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 16;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const radial = (size, stops) => canvasTex(size, size, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

// ---------------------------------------------------------------- céu
const sunDir = new THREE.Vector3(-0.50, 0.105, -1).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: sunDir } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);} `,
  fragmentShader: `
    varying vec3 vP; uniform vec3 sunDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<6;i++){ s+=a*vn(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return s; }
    void main(){
      vec3 d = normalize(vP); float h = d.y;
      vec3 zen = vec3(0.04,0.12,0.33), mid = vec3(0.22,0.36,0.62), hor = vec3(1.0,0.56,0.24), low = vec3(0.95,0.62,0.36);
      vec3 col = mix(hor, mid, smoothstep(0.0,0.22,h));
      col = mix(col, zen, smoothstep(0.18,0.75,h));
      if (h < 0.0) col = mix(hor, low, clamp(-h*6.0,0.0,1.0));
      float s = max(dot(d,sunDir),0.0);
      col += vec3(1.0,0.62,0.28) * pow(s, 10.0) * 0.55 * (1.0 - smoothstep(0.0,0.5,h));
      col += vec3(1.0,0.78,0.45) * pow(s, 60.0) * 0.9;
      col += vec3(1.0,0.95,0.8) * pow(s, 900.0) * 6.0;
      // nuvens: camada projetada num plano alto (converge no horizonte)
      if (h > 0.0) {
        vec2 p = d.xz / (h + 0.10);
        float dens = fbm(p * vec2(0.55, 1.15) + vec2(3.0, 1.0));
        dens = dens * 0.8 + fbm(p * 1.9 + 7.0) * 0.28;
        float cover = smoothstep(0.40, 0.62, dens) * smoothstep(0.010, 0.07, h);
        float thin  = smoothstep(0.36, 0.50, dens) * (1.0 - smoothstep(0.50, 0.66, dens));
        vec3 sdir = normalize(vec3(sunDir.x, 0.0, sunDir.z));
        float toward = pow(max(dot(normalize(vec3(d.x,0.0,d.z)), sdir), 0.0), 2.2);
        float low = 1.0 - smoothstep(0.0, 0.45, h);
        vec3 base = mix(vec3(0.10,0.08,0.17), vec3(0.30,0.20,0.30), smoothstep(0.45,0.8,dens));
        vec3 rim = vec3(1.0,0.50,0.18) * (0.25 + 1.9 * toward) * low;
        vec3 cl = base + rim * (0.35 + thin * 1.2);
        cl = mix(cl, vec3(1.0,0.72,0.45), thin * toward * 0.55);
        col = mix(col, cl, clamp(cover * 0.97, 0.0, 1.0));
        // cirros finos e altos
        float ci = fbm(vec2(p.x * 0.35, p.y * 2.6) + 11.0);
        float cir = smoothstep(0.55, 0.80, ci) * smoothstep(0.10, 0.5, h) * 0.30;
        col = mix(col, vec3(0.95,0.7,0.62) * (0.55 + 0.8 * toward), cir);
      }
      gl_FragColor = vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// mapa de reflexo (pintura e vidros refletem o pôr do sol)
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.015).texture;
  scene.environmentIntensity = 0.95;
}

const clouds = [];
// brilho do sol
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radial(256, [[0, 'rgba(255,245,210,1)'], [.12, 'rgba(255,200,120,.9)'], [.4, 'rgba(255,150,70,.35)'], [1, 'rgba(255,120,40,0)']]),
  transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending
}));
sunGlow.position.copy(sunDir).multiplyScalar(1300); sunGlow.scale.set(330, 330, 1); sunGlow.renderOrder = -4; scene.add(sunGlow);

// ---------------------------------------------------------------- luzes
const sun = new THREE.DirectionalLight(0xffb36a, 3.4);
sun.position.copy(sunDir).multiplyScalar(120).add(new THREE.Vector3(-2.5, 0, -8));
sun.target.position.set(-2.5, 0, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 260 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0x9bb8e8, 0x7a6240, 0.95));
const fill = new THREE.DirectionalLight(0xc2d4ff, 1.05); fill.position.set(7, 5, 16); scene.add(fill);

// ---------------------------------------------------------------- estrada e terreno
const roadTex = canvasTex(896, 1536, (g, w, h) => {
  g.fillStyle = '#7b7364'; g.fillRect(0, 0, w, h);                       // acostamento
  g.fillStyle = '#3a3d42'; g.fillRect(128, 0, 640, h);                   // asfalto
  for (let i = 0; i < 16000; i++) { g.fillStyle = `rgba(${rnd() > .5 ? 255 : 0},${rnd() > .5 ? 255 : 0},${rnd() > .5 ? 255 : 0},${rnd() * .05})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
  g.fillStyle = 'rgba(0,0,0,.14)'; [[250, 90], [585, 90]].forEach(([x, wd]) => g.fillRect(x - wd / 2, 0, wd, h)); // trilhas dos pneus
  g.fillStyle = '#f2f2ef';
  g.fillRect(154 - 6, 0, 12, h); g.fillRect(742 - 6, 0, 12, h);          // bordas
  for (const y0 of [0, 768]) g.fillRect(448 - 5, y0, 10, 192);           // tracejado central (3 m a cada 12 m)
}, true);
roadTex.repeat.set(1, 34);
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 816), new THREE.MeshStandardMaterial({ map: roadTex, roughness: .92, metalness: 0 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -380); road.receiveShadow = true; scene.add(road);

const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#5a7f2e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const l = 30 + rnd() * 40; g.fillStyle = `hsla(${70 + rnd() * 25},${45 + rnd() * 20}%,${l}%,.55)`; g.fillRect(rnd() * w, rnd() * h, 2, 4 + rnd() * 10); }
}, true);
grassTex.repeat.set(60, 160);
const grass = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1600), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
grass.rotation.x = -Math.PI / 2; grass.position.set(0, -0.03, -500); grass.receiveShadow = true; scene.add(grass);

// árvores e balizas em loop (período 32 m / 16 m)
const treeMats = ['#2e6a2f', '#3b7a35', '#4c8a3a', '#295c2c', '#5b8f3d'].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .9, flatShading: true }));
const trunkMat = new THREE.MeshStandardMaterial({ color: '#4a3622', roughness: 1 });
function makeTree(s) {
  seed = Math.abs(s) + 11; const g = new THREE.Group(); const sc = .8 + rnd() * 1.4;
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.18, .26, 2.6, 6), trunkMat); tr.position.y = 1.3; tr.castShadow = true; g.add(tr);
  for (let i = 0; i < 4; i++) {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25 + rnd() * .9, 1), treeMats[(rnd() * treeMats.length) | 0]);
    b.position.set((rnd() - .5) * 1.5, 3 + rnd() * 1.8, (rnd() - .5) * 1.5); b.scale.y = .9 + rnd() * .3; b.castShadow = true; g.add(b);
  }
  g.scale.setScalar(sc); return g;
}
const trees = [];
for (let side = -1; side <= 1; side += 2) {
  for (let i = 0; i < 13; i++) {
    for (let k = 0; k < 2; k++) {
      const t = makeTree(side * 1000 + i * 17 + k * 5);
      const x = side * (9 + rnd() * 20 + k * 14);
      const zBase = -400 + i * 32 + rnd() * 24;
      t.position.set(x, 0, zBase); t.userData = { zBase }; trees.push(t); scene.add(t);
    }
  }
}
const postMat = new THREE.MeshStandardMaterial({ color: '#e9ecef', roughness: .6 });
const posts = [];
for (let side = -1; side <= 1; side += 2) for (let i = 0; i < 40; i++) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.0, .12), postMat);
  const zBase = -620 + i * 16; p.position.set(side * 6.5, .5, zBase); p.userData = { zBase }; p.castShadow = true; posts.push(p); scene.add(p);
}
// árvore solitária contra o sol (silhueta)
{ const t = makeTree(99); t.scale.setScalar(2.6); t.position.set(-34, 0, -190); scene.add(t); }

// ---------------------------------------------------------------- caminhão
const truck = new THREE.Group();
const paint = new THREE.MeshPhysicalMaterial({ color: COR, metalness: .38, roughness: .34, clearcoat: 1, clearcoatRoughness: .1, envMapIntensity: 1.25 });
const dark = new THREE.MeshStandardMaterial({ color: '#1a1d21', roughness: .55, metalness: .35 });
const rubber = new THREE.MeshStandardMaterial({ color: '#121315', roughness: .95 });
const chrome = new THREE.MeshStandardMaterial({ color: '#eef2f6', metalness: 1, roughness: .16 });
const steel = new THREE.MeshStandardMaterial({ color: '#8a929a', metalness: .9, roughness: .4 });
const glass = new THREE.MeshPhysicalMaterial({ color: '#0b1724', metalness: .15, roughness: .04, clearcoat: 1, envMapIntensity: 2.2 });
const lampMat = new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: '#fff4d2', emissiveIntensity: 3.2 });
const ribTex = canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#f1f3f5'; g.fillRect(0, 0, w, h); g.fillStyle = '#d9dde1'; for (let x = 0; x < w; x += 16) g.fillRect(x, 0, 3, h); }, true);
ribTex.repeat.set(40, 1);
const trailerMat = new THREE.MeshStandardMaterial({ color: '#e9ecef', map: ribTex, roughness: .55, metalness: .08 });
const add = (geo, mat, x, y, z, parent = truck, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m; };
const RB = (w, h, d, r = .1, s = 5) => new RoundedBoxGeometry(w, h, d, s, r);

// cabine (bloco único, cantos arredondados) + carenagem de teto
add(RB(2.5, 2.4, 2.55, .24, 6), paint, 0, 2.15, -1.27);
const defl = add(RB(2.36, .5, 1.5, .2, 5), paint, 0, 3.52, -1.75); defl.rotation.x = .1;   // carenagem do teto
add(RB(2.54, .26, 2.2, .06), dark, 0, 1.02, -1.35);                  // saia inferior da cabine
const ws = add(new THREE.BoxGeometry(2.12, 1.12, .07), glass, 0, 2.42, .03); ws.rotation.x = -.1;   // para-brisa
add(RB(2.34, .13, .5, .05), dark, 0, 3.07, -.04);                    // viseira
add(RB(2.36, .06, .06, .02), dark, 0, 1.84, .07);                    // moldura inferior do vidro
// grade + faróis + para-choque
add(RB(1.74, .72, .1, .05), dark, 0, 1.43, .05);
for (let i = 0; i < 5; i++) add(new THREE.BoxGeometry(1.6, .035, .05), chrome, 0, 1.17 + i * .15, .12, truck, false);
add(new THREE.CylinderGeometry(.14, .14, .04, 24), chrome, 0, 1.47, .12, truck, false).rotation.x = Math.PI / 2;
for (const sx of [-1, 1]) {
  add(RB(.62, .32, .14, .06), lampMat, sx * 1.0, 1.35, .03, truck, false);
  add(RB(.66, .08, .08, .03), lampMat, sx * 1.0, 1.58, .03, truck, false);
  add(new THREE.CylinderGeometry(.09, .09, .05, 16), lampMat, sx * .78, .78, .27, truck, false).rotation.x = Math.PI / 2;
}
add(RB(2.54, .44, .34, .12), dark, 0, .78, .1);                      // para-choque
add(RB(1.6, .2, .26, .06), dark, 0, .52, .0);                        // spoiler inferior
add(new THREE.BoxGeometry(.54, .13, .02), new THREE.MeshStandardMaterial({ color: '#f4f4f0', roughness: .5 }), 0, .86, .28, truck, false);
// laterais: janelas, portas, espelhos, degraus, escapamento, tanque
for (const sx of [-1, 1]) {
  add(new THREE.BoxGeometry(.07, .98, 1.2), glass, sx * 1.26, 2.4, -.62);
  add(new THREE.BoxGeometry(.07, .5, .95), glass, sx * 1.26, 2.75, -1.95);
  add(new THREE.BoxGeometry(.03, 1.25, .03), dark, sx * 1.26, 1.95, -1.32, truck, false);
  add(new THREE.BoxGeometry(.03, .06, .22), chrome, sx * 1.27, 2.0, -1.0, truck, false);
  add(new THREE.CylinderGeometry(.025, .025, .5, 8), dark, sx * 1.5, 2.1, -.15, truck, false).rotation.z = Math.PI / 2;
  add(RB(.16, .66, .3, .06), dark, sx * 1.72, 2.36, -.15);
  add(new THREE.BoxGeometry(.02, .56, .24), chrome, sx * 1.8, 2.36, -.15, truck, false);
  add(RB(.5, .1, .5, .03), steel, sx * 1.36, .92, -.6, truck, false);                 // degrau
  add(new THREE.BoxGeometry(.04, .09, .26), new THREE.MeshStandardMaterial({ color: '#ff9a1a', emissive: '#ff8a00', emissiveIntensity: .8 }), sx * 1.27, 3.1, -.1, truck, false);
}
add(new THREE.CylinderGeometry(.1, .1, 3.0, 14), chrome, 1.5, 2.45, -2.6);                 // escapamento
add(new THREE.CylinderGeometry(.11, .11, .12, 14), dark, 1.5, 3.99, -2.6, truck, false);
const tank = add(new THREE.CylinderGeometry(.34, .34, 1.5, 24), chrome, 1.28, .75, -2.2); tank.rotation.x = Math.PI / 2;
const tank2 = add(new THREE.CylinderGeometry(.3, .3, 1.2, 24), steel, -1.28, .75, -2.2); tank2.rotation.x = Math.PI / 2;
// chassi e carreta
add(RB(1.1, .3, 15.5, .05), dark, 0, .82, -8.0);
add(RB(2.0, .12, 1.4, .04), dark, 0, 1.2, -3.1);                                           // quinta roda
const trailer = add(RB(2.62, 2.8, 12.2, .06), trailerMat, 0, 2.8, -8.8);
add(RB(2.66, .2, 12.2, .04), new THREE.MeshStandardMaterial({ color: '#c9ced3', roughness: .6 }), 0, 1.46, -8.8, truck, false);
add(RB(2.66, .1, 12.25, .03), new THREE.MeshStandardMaterial({ color: '#d7dbdf', roughness: .5 }), 0, 4.2, -8.8, truck, false);
for (const sx of [-1, 1]) {
  const tape = new THREE.Mesh(new THREE.PlaneGeometry(12, .09), new THREE.MeshStandardMaterial({ color: '#d3262b', roughness: .4, emissive: '#400000' }));
  tape.position.set(sx * 1.32, 1.58, -8.8); tape.rotation.y = sx * Math.PI / 2; truck.add(tape);
  // saia lateral
  add(RB(.06, .32, 6.0, .02), dark, sx * 1.2, 1.1, -7.4, truck, false);
}
// rodas
const wheels = [];
function wheel(x, z, dual = false) {
  const make = (px) => {
    const g = new THREE.Group(); g.position.set(px, .53, z);
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(.53, .53, .3, 40), rubber); tire.rotation.z = Math.PI / 2; tire.castShadow = true; g.add(tire);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .32, 32), chrome); rim.rotation.z = Math.PI / 2; g.add(rim);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .335, 32), steel); inner.rotation.z = Math.PI / 2; g.add(inner);
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      const n = new THREE.Mesh(new THREE.CylinderGeometry(.028, .028, .345, 8), chrome); n.rotation.z = Math.PI / 2; n.position.set(0, Math.cos(a) * .17, Math.sin(a) * .17); g.add(n);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .36, 16), steel); hub.rotation.z = Math.PI / 2; g.add(hub);
    truck.add(g); wheels.push(g);
  };
  for (const sx of [-1, 1]) { make(sx * 1.02); if (dual) make(sx * 1.36); }
  add(RB(.2, .06, 1.15, .02), dark, 1.02, 1.14, z, truck, false); add(RB(.2, .06, 1.15, .02), dark, -1.02, 1.14, z, truck, false);
}
wheel(0, -.9);
wheel(0, -3.3, true); wheel(0, -4.6, true);
wheel(0, -12.2, true); wheel(0, -13.5, true); wheel(0, -14.8, true);
// brilho dos faróis (halos aditivos)
const haloTex = radial(128, [[0, 'rgba(255,248,220,1)'], [.25, 'rgba(255,235,170,.55)'], [1, 'rgba(255,220,140,0)']]);
const halos = [];
for (const sx of [-1, 1]) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  s.position.set(sx * 1.0, 1.38, .3); s.scale.set(1.5, 1.5, 1); truck.add(s); halos.push(s);
}
const lampLight = new THREE.PointLight(0xfff0c8, 1.2, 9, 2); lampLight.position.set(0, 1.3, 1.4); truck.add(lampLight);
truck.position.set(-2.55, 0, 0);
scene.add(truck);

// ---------------------------------------------------------------- câmera
const camera = new THREE.PerspectiveCamera(38, W / H, .1, 2500);
const camBase = new THREE.Vector3(2.2, .95, 11.0), look = new THREE.Vector3(-2.3, 1.85, 0);

// ---------------------------------------------------------------- animação (loop perfeito)
window.renderT = (t) => {
  const ph = mod(t / LOOP, 1), TAU = Math.PI * 2;
  roadTex.offset.y = ph * 4;
  trees.forEach(o => { o.position.z = o.userData.zBase + mod(ph * ROAD_DIST, 32); });
  posts.forEach(o => { o.position.z = o.userData.zBase + mod(ph * ROAD_DIST, 16); });
  wheels.forEach(w => { w.rotation.x = ph * TAU * WHEEL_REVS; });
  const b1 = Math.sin(ph * TAU * 8), b2 = Math.sin(ph * TAU * 17 + .7);
  truck.position.y = .014 * b1 + .006 * b2;
  truck.rotation.x = .0035 * b1;
  trailer.rotation.z = .0015 * Math.sin(ph * TAU * 4);
  halos.forEach((h, i) => { const s = 1.5 + .12 * Math.sin(ph * TAU * 6 + i); h.scale.set(s, s, 1); });
  clouds.forEach((c, i) => { c.position.x += 0; c.material.rotation = 0; });
  camera.position.set(camBase.x + .09 * Math.sin(ph * TAU * 2), camBase.y + .035 * Math.sin(ph * TAU * 4 + .5), camBase.z);
  camera.lookAt(look.x + .05 * Math.sin(ph * TAU * 2 + 1), look.y, look.z);
  renderer.render(scene, camera);
  return true;
};
window.dbg = { trees, posts, scene, truck, halos, sunGlow };
window.renderT(0);
window.ready = true;
</script>
